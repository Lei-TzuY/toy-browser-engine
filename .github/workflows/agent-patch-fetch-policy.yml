name: Agent Fetch policy patch

on:
  push:
    branches:
      - agent/fetch-request-mode-credentialed-cors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fetch-request-mode-credentialed-cors
      - name: Apply focused policy fix and remove helper
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/script/fetch_api.rs")
          text = path.read_text()
          needle = "        let source_origin = Origin::of(&self.url);"
          replacement = '''        if request.credentials == RequestCredentials::Include
              && !matches!(scheme, "http" | "https")
          {
              return Err(FetchError::BadRequest(
                  "credentials mode \\"include\\" is only supported for HTTP(S) requests".into(),
              ));
          }

          let source_origin = Origin::of(&self.url);'''
          if text.count(needle) != 1:
              raise SystemExit(f"expected one source-origin needle, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement, 1))
          Path(".github/workflows/agent-patch-fetch-policy.yml").unlink()
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/script/fetch_api.rs .github/workflows/agent-patch-fetch-policy.yml
          git commit -m "Restrict credentialed Fetch to HTTP transports"
          git push origin HEAD:agent/fetch-request-mode-credentialed-cors
