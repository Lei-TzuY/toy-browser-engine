name: Agent Fetch policy formatter

on:
  push:
    branches:
      - agent/fetch-request-mode-credentialed-cors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fetch-request-mode-credentialed-cors
      - name: Format focused policy block and remove helper
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/script/fetch_api.rs")
          text = path.read_text()
          old = '''        if request.credentials == RequestCredentials::Include
    && !matches!(scheme, "http" | "https")
{
    return Err(FetchError::BadRequest(
        "credentials mode \\"include\\" is only supported for HTTP(S) requests".into(),
    ));
}

let source_origin = Origin::of(&self.url);'''
          new = '''        if request.credentials == RequestCredentials::Include
              && !matches!(scheme, "http" | "https")
          {
              return Err(FetchError::BadRequest(
                  "credentials mode \\"include\\" is only supported for HTTP(S) requests".into(),
              ));
          }

          let source_origin = Origin::of(&self.url);'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one malformed policy block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/agent-format-fetch-policy.yml").unlink()
      - name: Commit focused formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/script/fetch_api.rs .github/workflows/agent-format-fetch-policy.yml
          git commit -m "Format credentialed Fetch policy gate"
          git push origin HEAD:agent/fetch-request-mode-credentialed-cors

# Updated once so the workflow exists before its trigger push.
