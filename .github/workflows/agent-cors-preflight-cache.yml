name: Agent CORS preflight cache patch

on:
  push:
    branches:
      - agent/fetch-cors-preflight-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fetch-cors-preflight-cache
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        shell: python
        run: |
          import base64
          from pathlib import Path
          def d(s): return base64.b64decode(s).decode()
          def patch(path, old, new, label):
              p = Path(path); text = p.read_text(); count = text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))
          patch('src/script/interp.rs', d('ICAgIHB1YiBmZXRjaGVzOiBGZXRjaFJlZ2lzdHJ5PFBlbmRpbmdGZXRjaD4sCiAgICBkZXRhY2hlZDogVmVjPERldGFjaGVkU2xvdD4s'), d(''), 'runtime cache field')
          patch('src/script/interp.rs', d('ICAgICAgICAgICAgZmV0Y2hlczogRmV0Y2hSZWdpc3RyeTo6bmV3KCksCiAgICAgICAgICAgIHVybDogY3JhdGU6Om5ldDo6dXJsOjpVcmw6OnBhcnNlKCJkZW1vOi8vL2luZGV4Lmh0bWwiKS51bndyYXAoKSw='), d('ICAgICAgICAgICAgZmV0Y2hlczogRmV0Y2hSZWdpc3RyeTo6bmV3KCksCiAgICAgICAgICAgIGNvcnNfcHJlZmxpZ2h0X2NhY2hlOiBWZWM6Om5ldygpLAogICAgICAgICAgICB1cmw6IGNyYXRlOjpuZXQ6OnVybDo6VXJsOjpwYXJzZSgiZGVtbzovLy9pbmRleC5odG1sIikudW53cmFwKCks'), 'runtime cache init')
          patch('src/script/fetch_api.rs', d('Y29uc3QgRkVUQ0hBQkxFX1NDSEVNRVM6ICZbJnN0cl0gPSAmWyJodHRwIiwgImh0dHBzIiwgImZpbGUiXTsKCi8vLyBCcm93c2VyLW9ubHkgc3RhdGUgbmVlZGVkIHdoaWxlIGEgQ09SUyBmZXRjaCBpcyBpbiBmbGlnaHQu'), d(''), 'cache type')
          patch('src/script/fetch_api.rs', d('ICAgICAgICAgICAgICAgICAgICBsZXQgbmVlZHNfcHJlZmxpZ2h0ID0gY29ycwogICAgICAgICAgICAgICAgICAgICAgICAuYXNfcmVmKCkKICAgICAgICAgICAgICAgICAgICAgICAgLmlzX3NvbWVfYW5kKHxzdGF0ZXwgc3RhdGUubmVlZHNfcHJlZmxpZ2h0KTs='), d(''), 'cache lookup')
          patch('src/script/fetch_api.rs', d(''), d(''), 'cache store')
          patch('src/script/fetch_api.rs', d('ICAgIGZuIHF1ZXVlX2ZldGNoKAogICAgICAgICZtdXQgc2VsZiwKICAgICAgICByZXF1ZXN0OiBGZXRjaFJlcXVlc3Qs'), d(''), 'cache methods')
          patch('src/script/fetch_api.rs', d('Zm4gY29yc19wcmVmbGlnaHRfY29va2llX3BvbGljeSgpIC0+IENvb2tpZVJlcXVlc3RQb2xpY3kgew=='), d(''), 'helpers')
          patch('src/script/fetch_api.rs', d(''), d(''), 'authorization wildcard')
          patch('tests/fetch_cors_preflight.rs', d(''), d(''), 'preflight timing regression')
          Path('tests/fetch_cors_preflight_cache.rs').write_bytes(base64.b64decode(''))
          Path('.github/workflows/agent-cors-preflight-cache.yml').unlink()
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --locked
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Cache successful CORS preflights"
          git push origin HEAD:agent/fetch-cors-preflight-cache
