name: Agent CORS preflight cache patch

on:
  push:
    branches:
      - agent/fetch-cors-preflight-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fetch-cors-preflight-cache
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply cache implementation and regressions
        shell: python
        run: |
          import base64
          from pathlib import Path

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          p = Path("src/script/interp.rs")
          s = p.read_text()
          s = one(s,
              "    pub fetches: FetchRegistry<PendingFetch>,\n    detached: Vec<DetachedSlot>,",
              "    pub fetches: FetchRegistry<PendingFetch>,\n    /// Successful CORS preflight permissions owned by this browsing runtime.\n    pub(crate) cors_preflight_cache: Vec<super::fetch_api::CorsPreflightCacheEntry>,\n    detached: Vec<DetachedSlot>,",
              "runtime cache field")
          s = one(s,
              "            fetches: FetchRegistry::new(),\n            url: crate::net::url::Url::parse(\"demo:///index.html\").unwrap(),",
              "            fetches: FetchRegistry::new(),\n            cors_preflight_cache: Vec::new(),\n            url: crate::net::url::Url::parse(\"demo:///index.html\").unwrap(),",
              "runtime cache init")
          p.write_text(s)

          p = Path("src/script/fetch_api.rs")
          s = p.read_text()
          s = one(s,
              'const FETCHABLE_SCHEMES: &[&str] = &["http", "https", "file"];\n\n/// Browser-only state needed while a CORS fetch is in flight.',
              '''const FETCHABLE_SCHEMES: &[&str] = &["http", "https", "file"];

/// Fetch defaults preflight permissions to five seconds when Max-Age is absent or invalid.
const DEFAULT_CORS_PREFLIGHT_MAX_AGE_SECS: u64 = 5;
/// Deliberate user-agent cap; Fetch permits implementation-defined limits.
const MAX_CORS_PREFLIGHT_MAX_AGE_SECS: u64 = 7_200;

#[derive(Debug, Clone)]
pub(crate) struct CorsPreflightCacheEntry {
    source_origin: String,
    target_url: String,
    credentialed: bool,
    allowed_methods: Vec<String>,
    allowed_headers: Vec<String>,
    expires_at_ms: f64,
}

/// Browser-only state needed while a CORS fetch is in flight.''',
              "cache type")
          s = one(s,
              '''                    let needs_preflight = cors
                        .as_ref()
                        .is_some_and(|state| state.needs_preflight);''',
              '''                    let needs_preflight = match cors.as_ref() {
                        Some(state) if state.needs_preflight => {
                            !self.cors_preflight_cache_allows(&request, state)
                        }
                        _ => false,
                    };''',
              "cache lookup")
          s = one(s,
              '''                if let Err(error) = validate_cors_preflight_response(&cors, &response) {
                    self.reject_with(&promise, &error);
                    return;
                }

                let wire = request.to_wire();''',
              '''                if let Err(error) = validate_cors_preflight_response(&cors, &response) {
                    self.reject_with(&promise, &error);
                    return;
                }
                self.store_cors_preflight_permissions(&request, &cors, &response);

                let wire = request.to_wire();''',
              "cache store")
          s = one(s,
              '''    fn queue_fetch(
        &mut self,
        request: FetchRequest,''',
              '''    fn cors_preflight_cache_allows(
        &mut self,
        request: &RequestData,
        cors: &CorsFetchState,
    ) -> bool {
        let now = self.now_ms;
        self.cors_preflight_cache.retain(|entry| entry.expires_at_ms > now);
        let source = cors.source_origin.header_value();
        let target = request.url.to_string();
        self.cors_preflight_cache.iter().any(|entry| {
            if entry.source_origin != source
                || entry.target_url != target
                || !(entry.credentialed || !cors.credentialed)
            {
                return false;
            }
            let method_allowed = is_cors_safelisted_method(cors.requested_method)
                || entry.allowed_methods.iter().any(|method| {
                    method == "*" || method == cors.requested_method.as_str()
                });
            method_allowed
                && cors.requested_headers.iter().all(|requested| {
                    entry.allowed_headers.iter().any(|allowed| {
                        allowed.eq_ignore_ascii_case(requested)
                            || (allowed == "*"
                                && !is_cors_non_wildcard_request_header_name(requested))
                    })
                })
        })
    }

    fn store_cors_preflight_permissions(
        &mut self,
        request: &RequestData,
        cors: &CorsFetchState,
        response: &FetchResponse,
    ) {
        let max_age = cors_preflight_max_age_seconds(response);
        if max_age == 0 {
            return;
        }
        let source_origin = cors.source_origin.header_value();
        let target_url = request.url.to_string();
        let expires_at_ms = self.now_ms + max_age as f64 * 1_000.0;
        let allowed_methods = comma_tokens(response.headers.get("access-control-allow-methods"));
        let allowed_headers = comma_tokens(response.headers.get("access-control-allow-headers"));
        self.cors_preflight_cache.retain(|entry| {
            entry.source_origin != source_origin
                || entry.target_url != target_url
                || entry.credentialed != cors.credentialed
        });
        self.cors_preflight_cache.push(CorsPreflightCacheEntry {
            source_origin,
            target_url,
            credentialed: cors.credentialed,
            allowed_methods,
            allowed_headers,
            expires_at_ms,
        });
    }

    fn queue_fetch(
        &mut self,
        request: FetchRequest,''',
              "runtime cache methods")
          s = one(s,
              'fn cors_preflight_cookie_policy() -> CookieRequestPolicy {',
              '''fn is_cors_non_wildcard_request_header_name(name: &str) -> bool {
    name.eq_ignore_ascii_case("authorization")
}

fn cors_preflight_max_age_seconds(response: &FetchResponse) -> u64 {
    response
        .headers
        .get("access-control-max-age")
        .and_then(|value| value.parse::<u64>().ok())
        .unwrap_or(DEFAULT_CORS_PREFLIGHT_MAX_AGE_SECS)
        .min(MAX_CORS_PREFLIGHT_MAX_AGE_SECS)
}

fn cors_preflight_cookie_policy() -> CookieRequestPolicy {''',
              "max-age helper")
          s = one(s,
              '''        for requested in &cors.requested_headers {
            if !wildcard
                && !allowed
                    .iter()
                    .any(|header| header.eq_ignore_ascii_case(requested))
            {
                return Err(FetchError::Blocked(format!(
                    "CORS: preflight did not allow request header {requested}"
                )));
            }
        }''',
              '''        for requested in &cors.requested_headers {
            let wildcard_allowed =
                wildcard && !is_cors_non_wildcard_request_header_name(requested);
            if !wildcard_allowed
                && !allowed
                    .iter()
                    .any(|header| header.eq_ignore_ascii_case(requested))
            {
                return Err(FetchError::Blocked(format!(
                    "CORS: preflight did not allow request header {requested}"
                )));
            }
        }''',
              "Authorization wildcard semantics")
          p.write_text(s)

          p = Path("tests/fetch_cors_preflight.rs")
          s = p.read_text()
          stale = '''fn complete_preflight_and_send_actual(browser: &mut Browser, transport: &Rc<ManualNetwork>) {
    assert_eq!(transport.complete_all(), 1, "preflight should complete");
    let completion = browser.tick();
    assert_eq!(completion.network_completions, 1);
    assert_eq!(transport.requests().len(), 1, "actual request waits for a later send phase");
    let send = browser.tick();
    assert_eq!(send.requests_sent, 1);
}'''
          fixed = '''fn complete_preflight_and_send_actual(browser: &mut Browser, transport: &Rc<ManualNetwork>) {
    assert_eq!(transport.complete_all(), 1, "preflight should complete");
    let completion = browser.tick();
    assert_eq!(completion.network_completions, 1);
    assert_eq!(
        transport.requests().len(),
        2,
        "a permitted actual request is dispatched in the preflight completion turn"
    );
}'''
          if stale in s:
              p.write_text(s.replace(stale, fixed, 1))

          test_source = r'''use std::rc::Rc;

use browser_engine::browser::Browser;
use browser_engine::eventloop::ManualClock;
use browser_engine::net::{FetchResponse, ManualNetwork, MemoryLoader, Url};

fn url(input: &str) -> Url { Url::parse(input).expect("valid URL") }

fn response(endpoint: &str, max_age: &str, methods: &str, headers: &str) -> FetchResponse {
    let mut r = FetchResponse::synthetic(url(endpoint), 200, Some("text/plain"), b"ok".to_vec());
    r.headers.append_raw("access-control-allow-origin", "*");
    r.headers.append_raw("access-control-allow-methods", methods);
    r.headers.append_raw("access-control-allow-headers", headers);
    r.headers.append_raw("access-control-max-age", max_age);
    r
}

fn browser_for(script: &str, endpoint: &str, response: FetchResponse) -> (Browser, Rc<ManualNetwork>) {
    let page = "http://page.test/index.html";
    let mut loader = MemoryLoader::new();
    loader.insert(page, format!("<script>{script}</script>"));
    let transport = Rc::new(ManualNetwork::new());
    transport.respond(endpoint, response);
    let browser = Browser::open_with_network(
        Box::new(loader), transport.clone(), &url(page), Rc::new(ManualClock::new()),
    ).expect("page loads");
    (browser, transport)
}

fn drive(browser: &mut Browser, transport: &Rc<ManualNetwork>) {
    for _ in 0..12 { browser.tick(); transport.complete_all(); }
    browser.tick();
}

fn methods(transport: &ManualNetwork) -> Vec<&'static str> {
    transport.requests().iter().map(|request| match request.method.as_str() {
        "OPTIONS" => "OPTIONS", "PUT" => "PUT", "PATCH" => "PATCH",
        other => panic!("unexpected method {other}"),
    }).collect()
}

#[test]
fn positive_max_age_reuses_preflight_for_an_identical_request() {
    let endpoint = "http://api.test/data";
    let script = r#"
        fetch("http://api.test/data", { method: "PUT", headers: { "X-Token": "one" }, body: "a" })
          .then(function () { return fetch("http://api.test/data", { method: "PUT", headers: { "X-Token": "two" }, body: "b" }); })
          .then(function () { console.log("done"); }).catch(function () { console.log("blocked"); });
    "#;
    let (mut browser, transport) = browser_for(script, endpoint, response(endpoint, "60", "PUT", "x-token"));
    drive(&mut browser, &transport);
    assert_eq!(methods(&transport), vec!["OPTIONS", "PUT", "PUT"]);
    assert_eq!(browser.document().runtime.console, vec!["done"]);
}

#[test]
fn cache_reuses_all_method_and_header_permissions_granted_by_the_response() {
    let endpoint = "http://api.test/data";
    let script = r#"
        fetch("http://api.test/data", { method: "PUT", headers: { "X-Token": "one" }, body: "a" })
          .then(function () { return fetch("http://api.test/data", { method: "PATCH", headers: { "X-Other": "two" }, body: "b" }); })
          .then(function () { console.log("done"); });
    "#;
    let (mut browser, transport) = browser_for(script, endpoint, response(endpoint, "60", "PUT, PATCH", "x-token, x-other"));
    drive(&mut browser, &transport);
    assert_eq!(methods(&transport), vec!["OPTIONS", "PUT", "PATCH"]);
    assert_eq!(browser.document().runtime.console, vec!["done"]);
}

#[test]
fn zero_max_age_forces_the_next_request_to_preflight_again() {
    let endpoint = "http://api.test/data";
    let script = r#"
        fetch("http://api.test/data", { method: "PUT", headers: { "X-Token": "one" }, body: "a" })
          .then(function () { return fetch("http://api.test/data", { method: "PUT", headers: { "X-Token": "two" }, body: "b" }); })
          .then(function () { console.log("done"); });
    "#;
    let (mut browser, transport) = browser_for(script, endpoint, response(endpoint, "0", "PUT", "x-token"));
    drive(&mut browser, &transport);
    assert_eq!(methods(&transport), vec!["OPTIONS", "PUT", "OPTIONS", "PUT"]);
    assert_eq!(browser.document().runtime.console, vec!["done"]);
}

#[test]
fn authorization_is_not_satisfied_by_the_allow_headers_wildcard() {
    let endpoint = "http://api.test/data";
    let script = r#"
        fetch("http://api.test/data", { method: "PUT", headers: { "X-Token": "one" }, body: "a" })
          .then(function () { return fetch("http://api.test/data", { method: "PUT", headers: { "Authorization": "Bearer x" }, body: "b" }); })
          .catch(function () { console.log("blocked"); });
    "#;
    let (mut browser, transport) = browser_for(script, endpoint, response(endpoint, "60", "*", "*"));
    drive(&mut browser, &transport);
    assert_eq!(methods(&transport), vec!["OPTIONS", "PUT", "OPTIONS"]);
    assert_eq!(browser.document().runtime.console, vec!["blocked"]);
}
'''
