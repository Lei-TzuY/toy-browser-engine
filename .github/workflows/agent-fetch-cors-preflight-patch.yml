name: Agent Fetch CORS preflight patch

on:
  push:
    branches:
      - agent/fetch-cors-preflight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fetch-cors-preflight
      - name: Apply CORS preflight implementation and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_section(text, start, end, replacement, label):
              begin = text.find(start)
              if begin < 0:
                  raise SystemExit(f"{label}: start marker not found")
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:begin] + replacement + text[finish:]

          net_path = Path("src/net/fetch.rs")
          net = net_path.read_text()
          net = replace_once(
              net,
              '''    Patch,\n}''',
              '''    Patch,\n    Options,\n}''',
              "Method enum",
          )
          net = replace_once(
              net,
              '''            "PATCH" => Some(Method::Patch),\n            _ => None,''',
              '''            "PATCH" => Some(Method::Patch),\n            "OPTIONS" => Some(Method::Options),\n            _ => None,''',
              "Method parser",
          )
          net = replace_once(
              net,
              '''            Method::Patch => "PATCH",\n        }''',
              '''            Method::Patch => "PATCH",\n            Method::Options => "OPTIONS",\n        }''',
              "Method serialization",
          )
          net_path.write_text(net)

          same_site_path = Path("src/cookie_same_site.rs")
          same_site = same_site_path.read_text()
          same_site = replace_once(
              same_site,
              '''    /// Fetch's safe-method subset supported by this engine.\n    ///\n    /// RFC 9110 also defines OPTIONS and TRACE as safe, but this engine's public\n    /// Method enum does not expose either method. GET and HEAD are therefore the\n    /// complete safe-method set representable here.\n    pub const fn is_safe_method(self) -> bool {\n        matches!(self.method, Method::Get | Method::Head)\n    }''',
              '''    /// Fetch's safe-method subset supported by this engine.\n    ///\n    /// OPTIONS is exposed for CORS preflight. TRACE remains intentionally\n    /// unsupported, so GET, HEAD and OPTIONS are the representable safe methods.\n    pub const fn is_safe_method(self) -> bool {\n        matches!(self.method, Method::Get | Method::Head | Method::Options)\n    }''',
              "SameSite safe methods",
          )
          same_site_path.write_text(same_site)

          fetch_path = Path("src/script/fetch_api.rs")
          fetch = fetch_path.read_text()
          fetch = replace_once(
              fetch,
              '''use crate::net::fetch::{FetchError, FetchResponse, HeaderMap, Method, Origin};''',
              '''use crate::net::fetch::{\n    FetchError, FetchRequest, FetchResponse, HeaderMap, Method, Origin,\n};''',
              "FetchRequest import",
          )

          structures = '''/// Browser-only state needed while a CORS fetch is in flight.\n#[derive(Debug, Clone)]\nstruct CorsFetchState {\n    source_origin: Origin,\n    credentialed: bool,\n    requested_method: Method,\n    requested_headers: Vec<String>,\n    needs_preflight: bool,\n}\n\n/// Which network stage currently owns a script-visible Fetch promise.\n#[derive(Debug)]\nenum PendingFetchStage {\n    Actual {\n        cors: Option<CorsFetchState>,\n    },\n    Preflight {\n        request: RequestData,\n        cookie_policy: CookieRequestPolicy,\n        cors: CorsFetchState,\n    },\n}\n\n/// What the runtime keeps for one request it is waiting on.\n#[derive(Debug)]\npub struct PendingFetch {\n    pub promise: PromiseRef,\n    /// The signal watching this request, if `fetch` was given one.\n    pub signal: Option<Rc<AbortState>>,\n    stage: PendingFetchStage,\n}\n\n'''
          fetch = replace_section(
              fetch,
              "/// Browser-only state needed when the response task completes.\n",
              "fn rect_to_js",
              structures,
              "pending fetch structures",
          )

          start_fetch = '''    /// `fetch(input, init)` — returns a pending promise, always.\n    pub fn start_fetch(&mut self, args: Vec<JsValue>) -> JsValue {\n        let promise = promise::new_promise();\n\n        match self.prepare_request(&args) {\n            Err(error) => self.reject_with(&promise, &error),\n            Ok((request, cookie_policy, cors)) => {\n                let signal = request.signal.clone();\n                if signal.as_ref().is_some_and(|state| state.aborted()) {\n                    self.reject_with(&promise, &FetchError::Aborted);\n                } else {\n                    let needs_preflight = cors\n                        .as_ref()\n                        .is_some_and(|state| state.needs_preflight);\n                    let queued = if needs_preflight {\n                        let cors = cors.expect("preflight requires CORS state");\n                        let preflight = build_cors_preflight_request(&request, &cors);\n                        let pending = PendingFetch {\n                            promise: promise.clone(),\n                            signal,\n                            stage: PendingFetchStage::Preflight {\n                                request,\n                                cookie_policy,\n                                cors,\n                            },\n                        };\n                        self.queue_fetch(preflight, pending, cors_preflight_cookie_policy())\n                    } else {\n                        let wire = request.to_wire();\n                        let pending = PendingFetch {\n                            promise: promise.clone(),\n                            signal,\n                            stage: PendingFetchStage::Actual { cors },\n                        };\n                        self.queue_fetch(wire, pending, cookie_policy)\n                    };\n\n                    if let Err(error) = queued {\n                        self.reject_with(&promise, &error);\n                    }\n                }\n            }\n        }\n        JsValue::Promise(promise)\n    }\n\n'''
          fetch = replace_section(
              fetch,
              "    /// `fetch(input, init)` — returns a pending promise, always.\n",
              "    /// Settle the promise of a request the network has finished with.\n",
              start_fetch,
              "start_fetch",
          )

          settle_fetch = '''    /// Settle one network stage of a Fetch promise. A successful preflight\n    /// queues the actual request; only the actual response is exposed to script.\n    pub fn settle_fetch(\n        &mut self,\n        pending: PendingFetch,\n        result: Result<FetchResponse, FetchError>,\n    ) {\n        let PendingFetch {\n            promise,\n            signal,\n            stage,\n        } = pending;\n\n        if signal.as_ref().is_some_and(|state| state.aborted()) {\n            self.reject_with(&promise, &FetchError::Aborted);\n            return;\n        }\n\n        match stage {\n            PendingFetchStage::Actual { cors } => match result {\n                Ok(response) => {\n                    if let Some(cors) = &cors {\n                        if let Err(error) = validate_cors_response(\n                            &cors.source_origin,\n                            cors.credentialed,\n                            &response,\n                        ) {\n                            self.reject_with(&promise, &error);\n                            return;\n                        }\n                    }\n                    let value =\n                        host_value(HostObject::Response(ResponseData::from_wire(response)));\n                    self.settle_resolve(&promise, value);\n                }\n                Err(error) => self.reject_with(&promise, &error),\n            },\n            PendingFetchStage::Preflight {\n                request,\n                cookie_policy,\n                cors,\n            } => {\n                let response = match result {\n                    Ok(response) => response,\n                    Err(error) => {\n                        self.reject_with(&promise, &error);\n                        return;\n                    }\n                };\n                if let Err(error) = validate_cors_preflight_response(&cors, &response) {\n                    self.reject_with(&promise, &error);\n                    return;\n                }\n\n                let wire = request.to_wire();\n                let actual = PendingFetch {\n                    promise: promise.clone(),\n                    signal,\n                    stage: PendingFetchStage::Actual { cors: Some(cors) },\n                };\n                if let Err(error) = self.queue_fetch(wire, actual, cookie_policy) {\n                    self.reject_with(&promise, &error);\n                }\n            }\n        }\n    }\n\n    fn queue_fetch(\n        &mut self,\n        request: FetchRequest,\n        pending: PendingFetch,\n        cookie_policy: CookieRequestPolicy,\n    ) -> Result<(), FetchError> {\n        let id = self.fetches.start(request, pending)?;\n        if let Some(registry) = policy_registry_for_jar(&self.cookie_jar) {\n            registry.set(id, cookie_policy);\n        }\n        Ok(())\n    }\n\n'''
          fetch = replace_section(
              fetch,
              "    /// Settle the promise of a request the network has finished with.\n",
              "    /// Reject every request watching `state`, and stop their delivery.\n",
              settle_fetch,
              "settle_fetch",
          )

          prepare_request = '''    /// Turn `(input, init)` into a request plus browser-only Fetch policy.\n    fn prepare_request(\n        &mut self,\n        args: &[JsValue],\n    ) -> Result<(RequestData, CookieRequestPolicy, Option<CorsFetchState>), FetchError> {\n        let input = args.first().cloned().unwrap_or(JsValue::Undefined);\n        let init = args.get(1).cloned().unwrap_or(JsValue::Undefined);\n        let request = self.build_request(input, init)?;\n        let mode = request.mode;\n\n        let scheme = request.url.scheme();\n        if !FETCHABLE_SCHEMES.contains(&scheme) && scheme != self.url.scheme() {\n            return Err(FetchError::UnsupportedScheme(scheme.to_string()));\n        }\n        if request.credentials == RequestCredentials::Include\n            && !matches!(scheme, "http" | "https")\n        {\n            return Err(FetchError::BadRequest(\n                "credentials mode \\"include\\" is only supported for HTTP(S) requests".into(),\n            ));\n        }\n\n        let source_origin = Origin::of(&self.url);\n        let same_origin = source_origin.can_fetch(&request.url);\n        let cross_origin_web = matches!(self.url.scheme(), "http" | "https")\n            && matches!(request.url.scheme(), "http" | "https")\n            && !same_origin;\n\n        let cors = match mode {\n            RequestMode::SameOrigin if !same_origin => {\n                return Err(FetchError::Blocked(format!(\n                    "{} may not fetch {} in same-origin mode",\n                    source_origin.header_value(),\n                    request.url\n                )))\n            }\n            RequestMode::Cors if cross_origin_web => {\n                // Origin and the preflight-control fields are browser-owned.\n                // Strip authored copies before classification so they cannot\n                // influence either the preflight or the eventual actual request.\n                {\n                    let mut headers = request.headers.borrow_mut();\n                    headers.delete("origin");\n                    headers.delete("access-control-request-method");\n                    headers.delete("access-control-request-headers");\n                }\n\n                let requested_headers = cors_unsafe_request_header_names(&request);\n                let needs_preflight = !is_cors_safelisted_method(request.method)\n                    || !requested_headers.is_empty();\n                request\n                    .headers\n                    .borrow_mut()\n                    .insert_raw("origin", &source_origin.header_value());\n                Some(CorsFetchState {\n                    source_origin: source_origin.clone(),\n                    credentialed: request.credentials == RequestCredentials::Include,\n                    requested_method: request.method,\n                    requested_headers,\n                    needs_preflight,\n                })\n            }\n            RequestMode::Cors if !same_origin => {\n                // CORS is only meaningful for network tuple origins here. Keep\n                // the existing local-file containment boundary intact.\n                return Err(FetchError::Blocked(format!(\n                    "{} may not fetch {}",\n                    source_origin.header_value(),\n                    request.url\n                )))\n            }\n            _ => None,\n        };\n\n        let credentials = match request.credentials {\n            RequestCredentials::Omit => CookieCredentials::Omit,\n            RequestCredentials::SameOrigin if same_origin => CookieCredentials::Include,\n            RequestCredentials::SameOrigin => CookieCredentials::Omit,\n            RequestCredentials::Include => CookieCredentials::Include,\n        };\n        let same_site = if conservative_same_site(&self.url, &request.url) {\n            SameSiteRequestContext::same_site(request.method)\n        } else {\n            SameSiteRequestContext::cross_site_subresource(request.method)\n        };\n        let cookie_policy = CookieRequestPolicy::new(credentials, same_site);\n\n        Ok((request, cookie_policy, cors))\n    }\n\n'''
          fetch = replace_section(
              fetch,
              "    /// Turn `(input, init)` into a request plus browser-only Fetch policy.\n",
              "    /// The `Request` constructor, shared with `fetch`'s first argument.\n",
              prepare_request,
              "prepare_request",
          )

          helpers = '''fn conservative_same_site(source: &Url, target: &Url) -> bool {\n    source.scheme() == target.scheme() && source.host().eq_ignore_ascii_case(target.host())\n}\n\nfn is_cors_safelisted_method(method: Method) -> bool {\n    matches!(method, Method::Get | Method::Head | Method::Post)\n}\n\nfn contains_cors_unsafe_request_header_byte(value: &str) -> bool {\n    value.bytes().any(|byte| {\n        (byte < 0x20 && byte != b'\\t')\n            || byte == 0x7f\n            || b\"\\\"():<>?@[\\\\]{}\".contains(&byte)\n    })\n}\n\nfn is_cors_safelisted_request_header(name: &str, value: &str) -> bool {\n    if value.len() > 128 {\n        return false;\n    }\n    match name {\n        "accept" => !contains_cors_unsafe_request_header_byte(value),\n        "accept-language" | "content-language" => value.bytes().all(|byte| {\n            byte.is_ascii_alphanumeric() || b\" *,-.;=\".contains(&byte)\n        }),\n        "content-type" => {\n            if contains_cors_unsafe_request_header_byte(value) {\n                return false;\n            }\n            let mime = value\n                .split(';')\n                .next()\n                .unwrap_or(\"\")\n                .trim()\n                .to_ascii_lowercase();\n            matches!(\n                mime.as_str(),\n                "application/x-www-form-urlencoded" | "multipart/form-data" | "text/plain"\n            )\n        }\n        _ => false,\n    }\n}\n\nfn cors_unsafe_request_header_names(request: &RequestData) -> Vec<String> {\n    let mut names = Vec::new();\n    for (name, value) in request.headers.borrow().iter() {\n        if name != "origin" && !is_cors_safelisted_request_header(name, value) {\n            names.push(name.to_string());\n        }\n    }\n    names.sort();\n    names.dedup();\n    names\n}\n\nfn build_cors_preflight_request(request: &RequestData, cors: &CorsFetchState) -> FetchRequest {\n    let mut headers = HeaderMap::new();\n    headers.insert_raw("origin", &cors.source_origin.header_value());\n    headers.insert_raw(\n        "access-control-request-method",\n        cors.requested_method.as_str(),\n    );\n    if !cors.requested_headers.is_empty() {\n        headers.insert_raw(\n            "access-control-request-headers",\n            &cors.requested_headers.join(", "),\n        );\n    }\n    FetchRequest::new(request.url.clone(), Method::Options, headers, None)\n}\n\nfn cors_preflight_cookie_policy() -> CookieRequestPolicy {\n    CookieRequestPolicy::new(\n        CookieCredentials::Omit,\n        SameSiteRequestContext::cross_site_subresource(Method::Options),\n    )\n}\n\nfn validate_cors_response(\n    source_origin: &Origin,\n    credentialed: bool,\n    response: &FetchResponse,\n) -> Result<(), FetchError> {\n    let allow_origin = response.headers.get("access-control-allow-origin");\n    let serialized = source_origin.header_value();\n\n    if credentialed {\n        if allow_origin.as_deref() != Some(serialized.as_str()) {\n            return Err(FetchError::Blocked(\n                "CORS: credentialed response requires an exact Access-Control-Allow-Origin value"\n                    .into(),\n            ));\n        }\n        if response\n            .headers\n            .get("access-control-allow-credentials")\n            .as_deref()\n            != Some("true")\n        {\n            return Err(FetchError::Blocked(\n                "CORS: credentialed response requires Access-Control-Allow-Credentials: true"\n                    .into(),\n            ));\n        }\n        return Ok(());\n    }\n\n    if matches!(allow_origin.as_deref(), Some("*"))\n        || allow_origin.as_deref() == Some(serialized.as_str())\n    {\n        Ok(())\n    } else {\n        Err(FetchError::Blocked(\n            "CORS: cross-origin response did not allow the document origin".into(),\n        ))\n    }\n}\n\nfn comma_tokens(value: Option<String>) -> Vec<String> {\n    value\n        .unwrap_or_default()\n        .split(',')\n        .map(str::trim)\n        .filter(|token| !token.is_empty())\n        .map(str::to_string)\n        .collect()\n}\n\nfn validate_cors_preflight_response(\n    cors: &CorsFetchState,\n    response: &FetchResponse,\n) -> Result<(), FetchError> {\n    if response.redirected {\n        return Err(FetchError::Blocked(\n            "CORS: redirected preflight responses are not supported".into(),\n        ));\n    }\n    if !(200..300).contains(&response.status) {\n        return Err(FetchError::Blocked(format!(\n            "CORS: preflight response status {} is not successful",\n            response.status\n        )));\n    }\n    validate_cors_response(&cors.source_origin, cors.credentialed, response)?;\n\n    if !is_cors_safelisted_method(cors.requested_method) {\n        let methods = comma_tokens(response.headers.get("access-control-allow-methods"));\n        let wildcard = !cors.credentialed && methods.iter().any(|method| method == "*");\n        let exact = methods\n            .iter()\n            .any(|method| method == cors.requested_method.as_str());\n        if !wildcard && !exact {\n            return Err(FetchError::Blocked(format!(\n                "CORS: preflight did not allow method {}",\n                cors.requested_method\n            )));\n        }\n    }\n\n    if !cors.requested_headers.is_empty() {\n        let allowed = comma_tokens(response.headers.get("access-control-allow-headers"));\n        let wildcard = !cors.credentialed && allowed.iter().any(|header| header == "*");\n        for requested in &cors.requested_headers {\n            if !wildcard\n                && !allowed\n                    .iter()\n                    .any(|header| header.eq_ignore_ascii_case(requested))\n            {\n                return Err(FetchError::Blocked(format!(\n                    "CORS: preflight did not allow request header {requested}"\n                )));\n            }\n        }\n    }\n\n    Ok(())\n}\n'''
          marker = "fn conservative_same_site(source: &Url, target: &Url) -> bool {\n"
          begin = fetch.find(marker)
          if begin < 0:
              raise SystemExit("CORS helpers: start marker not found")
          fetch = fetch[:begin] + helpers
          fetch_path.write_text(fetch)

          simple_path = Path("tests/fetch_cors_simple.rs")
          simple = simple_path.read_text()
          old_test_start = "#[test]\nfn request_that_needs_preflight_is_rejected_without_sending() {\n"
          next_test = "#[test]\nfn default_cross_origin_credentials_omit_cookie_send_and_store() {\n"
          replacement = '''#[test]\nfn request_that_needs_preflight_starts_with_options_not_the_actual_request() {\n    let endpoint = "http://api.test/data";\n    let (mut browser, transport) = browser_for(\n        r#"fetch("http://api.test/data", {\n                 method: "PUT",\n                 headers: { "X-Token": "secret" },\n                 body: "payload"\n               }).catch(function () { console.log("blocked"); });"#,\n        endpoint,\n        cors_response(endpoint, Some("*")),\n    );\n\n    assert!(transport.requests().is_empty());\n    let turn = browser.tick();\n    assert_eq!(turn.requests_sent, 1);\n    let sent = transport.requests();\n    assert_eq!(sent.len(), 1);\n    assert_eq!(sent[0].method.as_str(), "OPTIONS");\n    assert_eq!(\n        sent[0].headers.get("access-control-request-method").as_deref(),\n        Some("PUT")\n    );\n    assert_eq!(\n        sent[0].headers.get("access-control-request-headers").as_deref(),\n        Some("x-token")\n    );\n    assert!(browser.document().runtime.console.is_empty());\n}\n\n'''
          simple = replace_section(
              simple,
              old_test_start,
              next_test,
              replacement,
              "existing preflight regression",
          )
          simple_path.write_text(simple)

          preflight_tests = r'''use std::rc::Rc;

use browser_engine::browser::Browser;
use browser_engine::eventloop::ManualClock;
use browser_engine::net::{FetchResponse, ManualNetwork, MemoryLoader, Url};

fn url(input: &str) -> Url {
    Url::parse(input).expect("valid URL")
}

fn response(
    endpoint: &str,
    allow_origin: &str,
    allow_methods: Option<&str>,
    allow_headers: Option<&str>,
    allow_credentials: bool,
) -> FetchResponse {
    let mut response = FetchResponse::synthetic(
        url(endpoint),
        200,
        Some("text/plain"),
        b"ok".to_vec(),
    );
    response
        .headers
        .append_raw("access-control-allow-origin", allow_origin);
    if let Some(value) = allow_methods {
        response
            .headers
            .append_raw("access-control-allow-methods", value);
    }
    if let Some(value) = allow_headers {
        response
            .headers
            .append_raw("access-control-allow-headers", value);
    }
    if allow_credentials {
        response
            .headers
            .append_raw("access-control-allow-credentials", "true");
    }
    response
}

fn browser_for(script: &str, endpoint: &str, response: FetchResponse) -> (Browser, Rc<ManualNetwork>) {
    let page = "http://page.test/index.html";
    let mut loader = MemoryLoader::new();
    loader.insert(page, format!("<script>{script}</script>"));
    let transport = Rc::new(ManualNetwork::new());
    transport.respond(endpoint, response);
    let browser = Browser::open_with_network(
        Box::new(loader),
        transport.clone(),
        &url(page),
        Rc::new(ManualClock::new()),
    )
    .expect("page loads");
    (browser, transport)
}

fn complete_preflight_and_send_actual(browser: &mut Browser, transport: &Rc<ManualNetwork>) {
    assert_eq!(transport.complete_all(), 1, "preflight should complete");
    let completion = browser.tick();
    assert_eq!(completion.network_completions, 1);
    assert_eq!(transport.requests().len(), 1, "actual request waits for a later send phase");
    let send = browser.tick();
    assert_eq!(send.requests_sent, 1);
}

#[test]
fn put_with_custom_header_preflights_then_sends_actual_request() {
    let endpoint = "http://api.test/data";
    let (mut browser, transport) = browser_for(
        r#"fetch("http://api.test/data", {
               method: "PUT",
               headers: { "X-Token": "secret" },
               body: "payload"
             }).then(function () { console.log("ok"); })
               .catch(function () { console.log("blocked"); });"#,
        endpoint,
        response(endpoint, "*", Some("PUT"), Some("x-token"), false),
    );

    let first = browser.tick();
    assert_eq!(first.requests_sent, 1);
    let requests = transport.requests();
    assert_eq!(requests.len(), 1);
    assert_eq!(requests[0].method.as_str(), "OPTIONS");
    assert_eq!(requests[0].headers.get("origin").as_deref(), Some("http://page.test"));
    assert_eq!(
        requests[0].headers.get("access-control-request-method").as_deref(),
        Some("PUT")
    );
    assert_eq!(
        requests[0].headers.get("access-control-request-headers").as_deref(),
        Some("x-token")
    );
    assert!(requests[0].headers.get("cookie").is_none());

    complete_preflight_and_send_actual(&mut browser, &transport);
    let requests = transport.requests();
    assert_eq!(requests.len(), 2);
    assert_eq!(requests[1].method.as_str(), "PUT");
    assert_eq!(requests[1].headers.get("x-token").as_deref(), Some("secret"));
    assert_eq!(requests[1].headers.get("origin").as_deref(), Some("http://page.test"));
    assert!(requests[1].headers.get("access-control-request-method").is_none());
    assert!(requests[1].headers.get("access-control-request-headers").is_none());

    assert_eq!(transport.complete_all(), 1);
    browser.tick();
    assert_eq!(browser.document().runtime.console, vec!["ok"]);
}

#[test]
fn denied_preflight_never_sends_the_actual_request() {
    let endpoint = "http://api.test/data";
    let (mut browser, transport) = browser_for(
        r#"fetch("http://api.test/data", {
               method: "PUT",
               headers: { "X-Token": "secret" },
               body: "payload"
             }).catch(function () { console.log("blocked"); });"#,
        endpoint,
        response(endpoint, "*", Some("GET"), Some("x-token"), false),
    );

    browser.tick();
    assert_eq!(transport.requests().len(), 1);
    assert_eq!(transport.complete_all(), 1);
    browser.tick();
    browser.tick();

    assert_eq!(transport.requests().len(), 1);
    assert_eq!(browser.document().runtime.console, vec!["blocked"]);
}

#[test]
fn credentialed_preflight_omits_cookie_then_actual_request_includes_it() {
    let endpoint = "http://page.test:8080/data";
    let mut allowed = response(
        endpoint,
        "http://page.test",
        Some("PUT"),
        Some("x-token"),
        true,
    );
    allowed
        .headers
        .append_raw("set-cookie", "server=new; Path=/");
    let (mut browser, transport) = browser_for(
        r#"fetch("http://page.test:8080/data", {
               method: "PUT",
               headers: { "X-Token": "secret" },
               body: "payload",
               credentials: "include"
             }).then(function () { console.log("ok"); });"#,
        endpoint,
        allowed,
    );

    let jar = browser.cookie_jar();
    assert!(jar.borrow_mut().store_set_cookie(
        "sid=abc; Path=/",
        &url("http://page.test:8080/"),
        0,
    ));

    browser.tick();
    let requests = transport.requests();
    assert_eq!(requests[0].method.as_str(), "OPTIONS");
    assert!(requests[0].headers.get("cookie").is_none());

    assert_eq!(transport.complete_all(), 1);
    browser.tick();
    assert_eq!(
        jar.borrow()
            .get_http_cookie_header(&url(endpoint), 0)
            .as_deref(),
        Some("sid=abc"),
        "preflight credentials are omitted, including response Set-Cookie"
    );

    browser.tick();
    let requests = transport.requests();
    assert_eq!(requests.len(), 2);
    assert_eq!(requests[1].headers.get("cookie").as_deref(), Some("sid=abc"));

    assert_eq!(transport.complete_all(), 1);
    browser.tick();
    let stored = jar
        .borrow()
        .get_http_cookie_header(&url(endpoint), 0)
        .unwrap_or_default();
    assert!(stored.contains("sid=abc"));
    assert!(stored.contains("server=new"));
    assert_eq!(browser.document().runtime.console, vec!["ok"]);
}

#[test]
fn noncredentialed_preflight_accepts_wildcard_method_and_headers() {
    let endpoint = "http://api.test/data";
    let (mut browser, transport) = browser_for(
        r#"fetch("http://api.test/data", {
               method: "PATCH",
               headers: { "X-Token": "secret" },
               body: "payload"
             }).then(function () { console.log("ok"); });"#,
        endpoint,
        response(endpoint, "*", Some("*"), Some("*"), false),
    );

    browser.tick();
    complete_preflight_and_send_actual(&mut browser, &transport);
    assert_eq!(transport.requests()[1].method.as_str(), "PATCH");
    assert_eq!(transport.complete_all(), 1);
    browser.tick();
    assert_eq!(browser.document().runtime.console, vec!["ok"]);
}

#[test]
fn credentialed_preflight_does_not_treat_method_or_header_wildcards_as_permission() {
    let endpoint = "http://page.test:8080/data";
    let (mut browser, transport) = browser_for(
        r#"fetch("http://page.test:8080/data", {
               method: "PUT",
               headers: { "X-Token": "secret" },
               body: "payload",
               credentials: "include"
             }).catch(function () { console.log("blocked"); });"#,
        endpoint,
        response(endpoint, "http://page.test", Some("*"), Some("*"), true),
    );

    browser.tick();
    assert_eq!(transport.complete_all(), 1);
    browser.tick();
    browser.tick();

    assert_eq!(transport.requests().len(), 1);
    assert_eq!(browser.document().runtime.console, vec!["blocked"]);
}
