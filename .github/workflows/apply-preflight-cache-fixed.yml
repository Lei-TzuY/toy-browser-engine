name: Apply corrected preflight cache patch

on:
  push:
    branches:
      - agent/fetch-cors-preflight-cache-v3
    paths:
      - .github/run_preflight_cache_fixed.py
      - .github/workflows/apply-preflight-cache-fixed.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python .github/run_preflight_cache_fixed.py
      - name: Run focused tests
        run: cargo test --locked --test fetch_cors_preflight_cache --test fetch_cors_preflight --test fetch_cors_simple
      - name: Run full suite
        run: cargo test --locked
      - name: Commit product changes
        run: |
          rm .github/apply_preflight_cache.py
          rm .github/run_preflight_cache_fixed.py
          rm .github/workflows/apply-preflight-cache.yml
          rm .github/workflows/apply-preflight-cache-fixed.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Cache Fetch CORS preflight permissions"
          git push origin HEAD:agent/fetch-cors-preflight-cache-v3
