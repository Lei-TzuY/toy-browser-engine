name: Apply Fetch no-cors opaque support

on:
  push:
    branches:
      - agent/fetch-no-cors-opaque

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair helper test patch point
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_fetch_no_cors.py')
          text = path.read_text()
          text = text.replace(
              "'''            assert_eq!(browser.document().runtime.console, vec![\"basic\"]);'''",
              "'''    assert_eq!(browser.document().runtime.console, vec![\"basic\"]);'''",
          )
          text = text.replace(
              "'''            assert_eq!(browser.document().runtime.console, vec![\"default\"]);'''",
              "'''    assert_eq!(browser.document().runtime.console, vec![\"default\"]);'''",
          )
          path.write_text(text)
          PY
      - name: Apply no-cors implementation
        run: python3 .github/scripts/apply_fetch_no_cors.py
      - name: Update legacy unsupported-mode regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/document_core.rs')
          text = path.read_text()
          old = 'fetch("a", { mode: "no-cors" }).catch(function (e) { console.log("mode: " + e); });'
          new = 'fetch("a", { mode: "navigate" }).catch(function (e) { console.log("mode: " + e); });'
          if old not in text:
              raise SystemExit('legacy unsupported-mode assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format patched files
        run: cargo fmt
      - name: Run focused no-cors tests
        run: |
          cargo test --locked --test fetch_no_cors
          cargo test --locked --test fetch_response_type
          cargo test --locked --test fetch_request_policy
          cargo test --locked --test fetch_cors_simple
          cargo test --locked --test fetch_cors_preflight
          cargo test --locked --test fetch_cors_response_headers
          cargo test --locked --lib unsupported_init_members_are_refused_rather_than_ignored
      - name: Run full suite
        run: cargo test --locked
      - name: Commit validated product changes
        shell: bash
        run: |
          git rm -f .github/scripts/apply_fetch_no_cors.py .github/workflows/apply-fetch-no-cors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Lei-TzuY@users.noreply.github.com"
          git add src/document_core.rs src/script/host.rs src/script/fetch_api.rs tests/fetch_response_type.rs tests/fetch_no_cors.rs
          git commit -m "Implement Fetch no-cors opaque responses"
          git push origin HEAD:agent/fetch-no-cors-opaque
