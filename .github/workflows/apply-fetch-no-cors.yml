name: Apply Fetch no-cors opaque support

on:
  push:
    branches:
      - agent/fetch-no-cors-opaque

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply no-cors implementation
        run: python3 .github/scripts/apply_fetch_no_cors.py
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run focused no-cors tests
        run: |
          cargo test --locked --test fetch_no_cors
          cargo test --locked --test fetch_response_type
          cargo test --locked --test fetch_request_policy
          cargo test --locked --test fetch_cors_simple
          cargo test --locked --test fetch_cors_preflight
          cargo test --locked --test fetch_cors_response_headers
      - name: Run full suite
        run: cargo test --locked
      - name: Commit validated product changes
        shell: bash
        run: |
          git rm .github/scripts/apply_fetch_no_cors.py .github/workflows/apply-fetch-no-cors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/script/host.rs src/script/fetch_api.rs tests/fetch_response_type.rs tests/fetch_no_cors.rs
          git commit -m "Implement Fetch no-cors opaque responses"
          git push origin HEAD:agent/fetch-no-cors-opaque
