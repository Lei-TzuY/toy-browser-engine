name: Research Preview checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }} locked tests and CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: browser_engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: browser_engine.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: M2-R3 loopback receipt privacy tests (no GUI)
        run: python -m unittest discover -s tests/gui -p test_windows_m2_r3_receipts.py -v
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package, extract, hash-check and run native CLI fixtures
        shell: bash
        run: |
          python scripts/package_release.py \
            --binary target/release/${{ matrix.binary }} \
            --metadata metadata.json --revision "$(git rev-parse HEAD)" \
            --target ${{ matrix.target }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: research-preview-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/*.receipt.json

  x11-gui:
    name: Actual Linux X11 GUI smoke (not Windows GUI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install isolated runner GUI test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool x11-xkb-utils libxtst6 imagemagick python3-pil fonts-dejavu-core
      - run: cargo build --release --locked
      - name: Real X11 tab window checks
        run: env -u WAYLAND_DISPLAY xvfb-run -a python3 tests/gui/tabs_window.py target/release/browser_engine gui-tabs
      - name: Real X11 shortcut routing (bounded two trials)
        run: env -u WAYLAND_DISPLAY python3 tests/gui/shortcut_routing.py target/release/browser_engine gui-routing --trials 2
      - name: Trusted local usability scenarios through actual X11 input
        run: env -u WAYLAND_DISPLAY python3 tests/gui/usability/linux_usability.py target/release/browser_engine gui-usability --source-repo "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-linux-x11-gui-receipts
          retention-days: 14
          path: |
            gui-tabs/
            gui-routing/
            gui-usability/

  # Real OS-level Win32 pointer/keyboard actions on a throwaway GitHub-hosted
  # Windows runner, not Owner's computer or a self-hosted/production machine.
  # These are trusted loopback fixtures, NOT live Windows Chinese IME tests.
  windows-native-input-research:
    name: Windows GUI native input research (hosted runner; no IME claim)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native test image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Build native Windows release candidate
        run: cargo build --release --locked
      - name: Verify exclusive GitHub-hosted runner before native input
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'SELF_HOSTED_REFUSED' }
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'NOT_CI_REFUSED' }
          if ($env:GITHUB_REPOSITORY -ne 'Lei-TzuY/toy-browser-engine') { throw 'WRONG_REPO_REFUSED' }
          Write-Host 'Exclusive hosted Windows runner preflight passed; this does not prove GUI availability'
      - name: Inventory loaded Windows IMM/TSF input layouts (not actual IME)
        shell: pwsh
        run: |
          python tests/gui/usability/windows_ime_inventory_ci.py
          if ($LASTEXITCODE -ne 0) { throw "HOSTED_IME_INVENTORY_FAILED" }
      - name: Real Windows owned-window keyboard and pointer smoke (local fixtures)
        shell: pwsh
        env:
          TOY_NAV_DEBUG: "1"
        run: |
          $revision = (git rev-parse HEAD).Trim()
          python tests/gui/usability/windows_usability.py --mode native --binary target/release/browser_engine.exe --output ci-windows-native-gui --revision $revision --selected U01,U02,U03,U04,U05,U06,U07,U08,U09,U10,U12,U13,U14,U15,U16,U17,U18,U19,U20,U21,U22,U23,U25,U26
          if ($LASTEXITCODE -ne 0) { throw "WIN_NATIVE_GUI_FAILED_OR_BLOCKED; inspect ci-windows-native-gui receipts" }
      - name: Real Windows synthetic Unicode clipboard Copy/Cut/Paste (not IME)
        shell: pwsh
        run: |
          python tests/gui/usability/windows_clipboard_ci.py
          if ($LASTEXITCODE -ne 0) { throw "WIN_CLIPBOARD_FAILED_OR_BLOCKED; inspect ci-windows-native-clipboard receipt" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-windows-native-gui-receipts
          retention-days: 14
          if-no-files-found: warn
          path: |
            ci-windows-native-gui/
            ci-windows-native-gui-desktop-preflight.json
            ci-windows-native-clipboard/
            ci-windows-ime-probe/
