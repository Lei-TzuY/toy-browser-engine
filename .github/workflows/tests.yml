name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Validation-only branch: the same `cargo test --locked` as main's
    # workflow, run natively on a standard GitHub-hosted Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Platform
        shell: bash
        run: uname -a && rustc -vV && cargo -V
      - run: cargo test --locked
      - name: Origin tests, repeated for flakiness
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "== repeat $i"
            cargo test --locked --test document_origin --test site || exit 1
          done
