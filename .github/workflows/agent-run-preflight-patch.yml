name: Run CORS preflight patch

on:
  push:
    branches:
      - agent/fetch-cors-preflight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fetch-cors-preflight
      - name: Apply preflight patch
        run: python tools/extract_and_run_preflight_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Fetch CORS preflight"
          git push origin HEAD:agent/fetch-cors-preflight
