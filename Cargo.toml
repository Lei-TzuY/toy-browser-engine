[package]
name = "browser_engine"
version = "0.1.0"
edition = "2021"
description = "A minimal browser engine built from scratch in Rust"
authors = ["CS Projects"]

[[bin]]
name = "browser_engine"
path = "src/main.rs"

[lib]
name = "browser_engine"
path = "src/lib.rs"

[dependencies]
fontdue = "0.9.3"
minifb = "0.28.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
